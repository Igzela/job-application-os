<!DOCTYPE html>
<html lang="en">
<head><title>Mock Application Form</title></head>
<body>
<h1>Job Application</h1>
<form id="application-form" action="https://example.com/apply" method="POST">
  <label for="first_name">First Name</label>
  <input type="text" id="first_name" name="first_name" value="">

  <label for="last_name">Last Name</label>
  <input type="text" id="last_name" name="last_name" value="">

  <label for="email">Email</label>
  <input type="email" id="email" name="email" value="">

  <label for="phone">Phone</label>
  <input type="tel" id="phone" name="phone" value="">

  <label for="linkedin">LinkedIn</label>
  <input type="url" id="linkedin" name="linkedin" value="">

  <label for="location">Location</label>
  <input type="text" id="location" name="location" value="">

  <label for="position_title">Position</label>
  <input type="text" id="position_title" name="position_title" value="">

  <label for="company_name">Company</label>
  <input type="text" id="company_name" name="company_name" value="">

  <label for="work_authorization">Work Authorization</label>
  <select id="work_authorization" name="work_authorization">
    <option value="">-- Select --</option>
    <option value="opt">OPT/CPT</option>
    <option value="citizen">US Citizen</option>
    <option value="green_card">Green Card</option>
  </select>

  <label for="cover_letter">Cover Letter</label>
  <textarea id="cover_letter" name="cover_letter" rows="6"></textarea>

  <label for="skills">Skills</label>
  <textarea id="skills" name="skills" rows="3"></textarea>

  <button type="submit">Submit Application</button>
</form>
</body>
</html>
