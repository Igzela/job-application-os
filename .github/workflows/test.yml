name: Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" 2>/dev/null || pip install -e .
          pip install pytest pyyaml beautifulsoup4

      - name: Run tests
        run: |
          python -m compileall -q jobos
          bash scripts/check_architecture.sh
          python -m pytest tests/ -v --tb=short

      - name: Verify CLI
        run: |
          cd /tmp && mkdir -p verify-cli && cd verify-cli
          job init
          job demo-seed
          job doctor
          job queue
          test -f .job-state.json
          test -d profile
          test -f rubrics/v0_student_internship.md
          test -f jobs/raw/sample_swe_intern.md
